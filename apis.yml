  - type: Plans
    url: >-
      https://raw.githubusercontent.com/api-evangelist/open-banking-uk/refs/heads/main/plans/plans.yml
  contact:
  - FN: Open Banking Implementation Entity
    url: https://www.openbanking.org.uk/
    email: servicedesk@openbanking.org.uk
- name: UK Open Banking Dynamic Client Registration API
  description: >-
    Allows TPPs to dynamically register as OAuth clients with ASPSPs by submitting Software Statement
    Assertions issued by the Open Banking Directory. Supports client creation, retrieval, update, and
    deletion, and enables automated TPP onboarding without manual bank-by-bank enrollment.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://standards.openbanking.org.uk/api-specifications/
  baseURL: https://{aspsp-host}/open-banking/v3.3
  tags:
  - Dynamic Client Registration
  - Authentication
  - TPP Onboarding
  - Security
  tags_raw:
  - Dynamic Client Registration
  - OAuth
  - TPP Onboarding
  - Security
