apis:
- name: UK Open Banking Open Data API
  description: >-
    Public-facing APIs enabling third-party developers to access standardized open data published by Account
    Servicing Payment Service Providers, including ATM locations, branch locations, personal current account
    products, business current account products, SME credit cards, and SME loans. No customer authentication
    required.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://openbankinguk.github.io/opendata-api-docs-pub/
  baseURL: https://{aspsp-host}/open-banking/v2.4
  tags:
  - ATM Locator
  - Branch Locator
  - Product Data
  - Open Data
  - Public APIs
  properties:
  - type: Documentation
    url: https://openbankinguk.github.io/opendata-api-docs-pub/
